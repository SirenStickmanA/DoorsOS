<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <style>
        * { box-sizing: border-box; }
        body { 
            margin: 0; 
            padding: 0; 
            font-family: 'Tahoma', sans-serif; 
            background: url('bottom.jpg') no-repeat center center fixed; 
            background-size: cover;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* BARRA DE NAVEGAÇÃO ESTILO XP/WOOD */
        .browser-toolbar {
            background: #c0c0c0;
            padding: 5px;
            border-bottom: 2px solid #808080;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        .nav-controls {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 5px;
        }

        .address-bar-container {
            display: flex;
            background: white;
            border: 2px inset #808080;
            align-items: center;
            padding: 2px 5px;
            flex: 1;
        }

        .address-bar-container span {
            font-size: 11px;
            color: #555;
            margin-right: 5px;
        }

        #url-input {
            border: none;
            outline: none;
            width: 100%;
            font-size: 13px;
            font-family: 'Segoe UI', sans-serif;
        }

        button {
            background: #e1e1e1;
            border: 1px solid #808080;
            padding: 3px 10px;
            cursor: pointer;
            font-size: 11px;
            box-shadow: 1px 1px 0 #fff inset;
        }

        button:active { background: #d1d1d1; box-shadow: 1px 1px 0 #808080 inset; }

        /* ÁREA DE CONTEÚDO (ESTILO CARVALHO) */
        #web-viewport {
            flex: 1;
            background: rgba(245, 222, 179, 0.9); /* Cor de trigo/madeira clara */
            border: 10px solid #573a24; /* Moldura Carvalho */
            margin: 10px;
            overflow-y: auto;
            position: relative;
        }

        .wood-net-home {
            padding: 40px;
            text-align: center;
            color: #3d2b1f;
        }

        .doors-search-logo {
            font-size: 48px;
            font-weight: bold;
            color: #573a24;
            text-shadow: 2px 2px #d2b48c;
            margin-bottom: 20px;
            font-family: 'Georgia', serif;
        }

        .search-container {
            margin: 20px auto;
            max-width: 500px;
            display: flex;
            gap: 10px;
        }

        .search-input {
            flex: 1;
            padding: 10px;
            border: 3px solid #8b4513;
            border-radius: 20px;
            outline: none;
        }

        /* RESULTADOS DO DOORS NAVIGATE */
        #results-area {
            display: none;
            padding: 20px;
            text-align: left;
        }

        .result-item {
            margin-bottom: 20px;
            border-bottom: 1px dotted #8b4513;
            padding-bottom: 10px;
        }

        .result-item a {
            color: #0000ee;
            font-size: 18px;
            text-decoration: underline;
            cursor: pointer;
        }

        .result-item p { font-size: 14px; margin: 5px 0; }
    </style>
</head>
<body>

    <div class="browser-toolbar">
        <div class="nav-controls">
            <button onclick="goHome()">🏠 Início</button>
            <div class="address-bar-container">
                <span>Endereço</span>
                <input type="text" id="url-input" value="wood://network/carvalho">
            </div>
            <button onclick="navigate()">Ir</button>
        </div>
    </div>

    <div id="web-viewport">
        <div id="home-page" class="wood-net-home">
            <div class="doors-search-logo">Doors Search</div>
            <p>Conectando você à Wood.Net Estilo Carvalho</p>
            
            <div class="search-container">
                <input type="text" id="main-search" class="search-input" placeholder="O que você deseja esculpir hoje?">
                <button onclick="doorsSearch()">Pesquisar</button>
            </div>
            
            <div style="margin-top: 50px; font-size: 12px;">
                <b>Sites Sugeridos:</b><br>
                <a onclick="loadURL('https://google.com')">Google.com</a> | 
                <a onclick="loadURL('wood://serra/noticias')">Portal da Serraria</a>
            </div>
        </div>

        <div id="results-area">
            <h2 id="search-title" style="color: #573a24;">Resultados do Doors Navigate:</h2>
            <div id="results-list"></div>
            <button onclick="goHome()">⬅ Voltar</button>
        </div>

        <iframe id="external-frame" style="display:none; width:100%; height:100%; border:none;"></iframe>
    </div>

    <script>
        const urlInput = document.getElementById('url-input');
        const homePage = document.getElementById('home-page');
        const resultsArea = document.getElementById('results-area');
        const resultsList = document.getElementById('results-list');
        const externalFrame = document.getElementById('external-frame');

        function doorsSearch() {
            const query = document.getElementById('main-search').value.toLowerCase();
            if(!query) return;

            homePage.style.display = 'none';
            externalFrame.style.display = 'none';
            resultsArea.style.display = 'block';
            urlInput.value = "wood://navigate/search?q=" + query;

            // Lógica de Resultados do Doors Navigate
            let results = "";
            if(query.includes("porta")) {
                results = `
                    <div class="result-item">
                        <a onclick="loadURL('wood://portas/modelos')">Catálogo de Portas Carvalho 1999</a>
                        <p>Veja os melhores modelos de portas para a sua Build 1002.</p>
                    </div>
                `;
            } else if(query.includes("cupim")) {
                results = `
                    <div class="result-item">
                        <a onclick="loadURL('wood://defesa/cupim')">Manual Anti-Cupim</a>
                        <p>Proteja seu DoorsOS contra pragas virtuais.</p>
                    </div>
                `;
            } else {
                results = `<p>Nenhum entalhe encontrado para "${query}". Tente buscar por 'porta' ou 'cupim'.</p>`;
            }
            resultsList.innerHTML = results;
        }

        function loadURL(url) {
            urlInput.value = url;
            if(url.startsWith('https://')) {
                homePage.style.display = 'none';
                resultsArea.style.display = 'none';
                externalFrame.style.display = 'block';
                externalFrame.src = url;
                // Nota: Muitos sites bloqueiam iframe (X-Frame-Options), o que é realista para a época
            } else {
                alert("Carregando página interna Wood.Net: " + url);
            }
        }

        function navigate() {
            const val = urlInput.value;
            if(val.startsWith('https')) loadURL(val);
            else doorsSearch();
        }

        function goHome() {
            homePage.style.display = 'block';
            resultsArea.style.display = 'none';
            externalFrame.style.display = 'none';
            urlInput.value = "wood://network/carvalho";
        }
    </script>
</body>
                </html>
