<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Handle Navigator 1.0</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            margin: 0; padding: 0; 
            font-family: 'Tahoma', sans-serif; 
            background: url('bottom.jpg') no-repeat center center fixed; 
            background-size: cover;
            display: flex; flex-direction: column; height: 100vh;
        }

        .browser-toolbar {
            background: #c0c0c0; padding: 5px; border-bottom: 2px solid #808080;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            display: flex; flex-direction: column; gap: 5px;
        }

        .nav-controls { display: flex; align-items: center; gap: 8px; }

        .address-bar-container {
            display: flex; background: white; border: 2px inset #808080;
            align-items: center; padding: 2px 5px; flex: 1;
        }

        #url-input { border: none; outline: none; width: 100%; font-size: 13px; }

        button {
            background: #e1e1e1; border: 1px solid #808080;
            padding: 3px 10px; cursor: pointer; font-size: 11px;
            box-shadow: 1px 1px 0 #fff inset;
        }
        button:active { border-style: inset; }

        #web-viewport {
            flex: 1; background: rgba(245, 222, 179, 0.95); 
            border: 10px solid #573a24; margin: 10px; overflow-y: auto;
        }

        .ai-box {
            background: #fdf5e6; border: 2px solid #8b4513;
            padding: 15px; margin-bottom: 20px; border-radius: 8px;
            display: none;
        }
        .ai-header { font-weight: bold; color: #573a24; font-size: 14px; margin-bottom: 5px; display: flex; align-items: center; gap: 5px;}

        .result-item { margin-bottom: 20px; border-bottom: 1px dotted #8b4513; padding-bottom: 10px; }
        
        .page-content { padding: 40px; color: #3d2b1f; }
        .wood-net-home { padding: 40px; text-align: center; }
        .doors-search-logo { font-size: 48px; font-weight: bold; color: #573a24; text-shadow: 2px 2px #d2b48c; font-family: 'Georgia', serif; }
        .search-input { width: 300px; padding: 10px; border: 2px solid #8b4513; border-radius: 20px; outline: none; }
        
        .loading-text { font-family: monospace; color: #573a24; font-style: italic; font-weight: bold; }

        /* Painel de Configuração da Chave */
        .key-panel { background: #a0a0a0; padding: 4px; display: none; align-items: center; gap: 10px; font-size: 11px; border-bottom: 1px solid #666; }
        .key-panel input { padding: 2px; border: 2px inset #fff; width: 250px; }
    </style>
</head>
<body>

    <div class="browser-toolbar">
        <div class="nav-controls">
            <button onclick="goHome()">🏠 Home</button>
            <button onclick="toggleKeyPanel()">🔑 Config API</button>
            <div class="address-bar-container">
                <input type="text" id="url-input" value="wood://network/carvalho" onkeydown="if(event.key==='Enter') navigate()">
            </div>
            <button onclick="navigate()">Ir</button>
        </div>
        
        <div id="key-panel" class="key-panel">
            <span>SambaNova API Key:</span>
            <input type="password" id="api-key-input" placeholder="Cole sua chave aqui...">
            <button onclick="saveApiKey()">Salvar Chave</button>
            <span id="key-status" style="color: green; font-weight: bold; margin-left: 10px;"></span>
        </div>
    </div>

    <div id="web-viewport">
        <div id="home-page" class="wood-net-home">
            <div class="doors-search-logo">Doors Search</div>
            <p>Conhecimento Total: 4.5 Bilhões de Anos atrás até 15/01/1999</p>
            <div style="margin: 20px;">
                <input type="text" id="main-search" class="search-input" placeholder="Pergunte ao Doors Answers...">
                <button onclick="doorsSearch()" style="border-radius: 20px;">Pesquisar</button>
            </div>
        </div>

        <div id="results-area" style="display:none; padding: 20px;">
            <div id="doors-answers" class="ai-box">
                <div class="ai-header">✨ Doors Answers (SambaNova Engine)</div>
                <div id="ai-text"></div>
            </div>
            <div id="results-list"></div>
        </div>

        <div id="page-viewer" style="display:none;" class="page-content"></div>
    </div>

    <script>
        const systemPrompt = `Você é a inteligência artificial "Doors Answers" integrada ao motor de buscas da Wood.Net.
Estamos exatamente no dia 15 de Janeiro de 1999.
Instruções de Resposta:
1. Você tem conhecimento completo sobre tudo o que aconteceu no universo desde 4.5 bilhões de anos atrás até o dia de hoje (15/01/1999).
2. Se o usuário pesquisar ou requisitar algo que ocorreu APÓS 15/01/1999, você deve atuar no personagem e afirmar que essa informação não existe no banco de dados atual ou que pertence ao futuro distante.
3. Formate a resposta estruturada com títulos simples usando tags HTML básicas (como <h1>, <p>, <ul>, <li>) e mantenha uma linguagem enciclopédica.`;

        window.onload = function() {
            const savedKey = localStorage.getItem('sambanova_nav_key');
            if (savedKey) {
                document.getElementById('api-key-input').value = savedKey;
                document.getElementById('key-status').innerText = "Chave Ativa!";
            }
        };

        function toggleKeyPanel() {
            const panel = document.getElementById('key-panel');
            panel.style.display = panel.style.display === 'flex' ? 'none' : 'flex';
        }

        function saveApiKey() {
            const key = document.getElementById('api-key-input').value.trim();
            if (key) {
                localStorage.setItem('sambanova_nav_key', key);
                document.getElementById('key-status').innerText = "Salva com sucesso!";
                setTimeout(() => { toggleKeyPanel(); }, 1000);
            } else {
                localStorage.removeItem('sambanova_nav_key');
                document.getElementById('key-status').innerText = "Chave removida.";
            }
        }

        async function fetchAIResponse(userPrompt) {
            const apiKey = localStorage.getItem('sambanova_nav_key');
            
            if (!apiKey) {
                return "<h1>Chave API Não Encontrada</h1><p>Mano, como seu site está no GitHub, clique no botão <strong>🔑 Config API</strong> ali em cima e cole sua chave da SambaNova para ativar o navegador!</p>";
            }

            try {
                const response = await fetch("https://api.sambanova.ai/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${apiKey}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        model: "meta-llama/Meta-Llama-3.1-8B-Instruct", // Identificador corrigido para a conta free do ecossistema SambaNova
                        messages: [
                            { role: "system", content: systemPrompt },
                            { role: "user", content: userPrompt }
                        ],
                        temperature: 0.3
                    })
                });

                if (!response.ok) {
                    const errorDetail = await response.json().catch(() => ({}));
                    throw new Error(errorDetail.error?.message || `Erro HTTP status ${response.status}`);
                }
                
                const data = await response.json();
                return data.choices[0].message.content;

            } catch (error) {
                return `<h1>Erro de Conexão</h1><p>Não foi possível processar a requisição: ${error.message}</p><p>Dica: Verifique se sua chave inserida no painel Config API está correta.</p>`;
            }
        }

        async function doorsSearch() {
            const query = document.getElementById('main-search').value.trim();
            if(!query) return;

            document.getElementById('home-page').style.display = 'none';
            document.getElementById('page-viewer').style.display = 'none';
            document.getElementById('results-area').style.display = 'block';
            document.getElementById('doors-answers').style.display = 'block';
            
            document.getElementById('ai-text').innerHTML = `<span class="loading-text">O usuário pesquisou "${query}". Pesquisando sobre ela e fazendo um resumo para enviar os resultados...</span>`;
            document.getElementById('results-list').innerHTML = "";
            
            document.getElementById('url-input').value = "wood://search?q=" + encodeURIComponent(query).replace(/%20/g, "_");

            const promptComando = `O usuário pesquisou "${query}" no Doors Search. Pesquise sobre ela e faça um resumo para enviar os resultados estruturados.`;
            const respostaIA = await fetchAIResponse(promptComando);
            document.getElementById('ai-text').innerHTML = respostaIA;
        }

        async function navigate() {
            const url = document.getElementById('url-input').value.trim();
            if (!url) return;

            document.getElementById('home-page').style.display = 'none';
            document.getElementById('results-area').style.display = 'none';
            
            const viewer = document.getElementById('page-viewer');
            viewer.style.display = 'block';
            viewer.innerHTML = `<span class="loading-text">Um usuário entrou no Handle Navigator! Conectando e requisitando dados para: ${url}...</span>`;

            const promptComando = `O usuário tentou acessar diretamente a URL "${url}". Gere o conteúdo em formato de página web fictícia baseada em madeira ou dados históricos de 1999 apropriados para este endereço.`;
            const respostaIA = await fetchAIResponse(promptComando);
            viewer.innerHTML = respostaIA + `<br><br><button onclick="goHome()" style="background:#573a24; color:white; border:none; padding:10px; cursor:pointer;">🏠 Voltar para Home</button>`;
        }

        function goHome() {
            document.getElementById('home-page').style.display = 'block';
            document.getElementById('results-area').style.display = 'none';
            document.getElementById('page-viewer').style.display = 'none';
            document.getElementById('url-input').value = "wood://network/carvalho";
            document.getElementById('main-search').value = "";
        }
    </script>
</body>
</html>
