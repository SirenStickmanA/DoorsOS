<!DOCTYPE html>
<html>
<head>
    <title>Update Manager</title>
    <style>
        body { background: #c0c0c0; font-family: 'Courier New', monospace; padding: 20px; }
        .box { border: 3px solid #fff; border-right-color: #808080; border-bottom-color: #808080; padding: 15px; background: #dcdcdc; }
        .progress { width: 100%; height: 20px; background: #808080; border: 2px inset #fff; margin: 10px 0; }
        #bar { width: 0%; height: 100%; background: #000080; }
        button { padding: 5px 15px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <div class="box">
        <h3 id="title">Verificando Atualizações...</h3>
        <p id="desc" style="font-size:11px;"></p>
        <div class="progress"><div id="bar"></div></div>
        <button id="btn" onclick="startUpdate()">Atualizar</button>
    </div>

    <script>
        let currentBuild = localStorage.getItem('doors_build') || "999";
        const btn = document.getElementById('btn');
        const desc = document.getElementById('desc');

        window.onload = () => {
            if(currentBuild === "1006") {
                document.getElementById('title').innerText = "UPGRADE DISPONÍVEL!";
                desc.innerText = "Nova Versão: Doors 2.0 (2000 Edition). Clique para migrar para o novo milênio.";
                btn.innerText = "UPGRADE PARA 2.0";
            } else if (currentBuild === "2000_Edition") {
                desc.innerText = "Seu sistema está no futuro. Nenhuma atualização pendente.";
                btn.disabled = true;
            } else {
                desc.innerText = "Build " + (parseInt(currentBuild) + 1) + " disponível.";
            }
        };

        function startUpdate() {
            btn.disabled = true;
            let w = 0;
            const itv = setInterval(() => {
                w += 2;
                document.getElementById('bar').style.width = w + '%';
                if(w >= 100) {
                    clearInterval(itv);
                    let next = (currentBuild === "1006") ? "2000_Edition" : (parseInt(currentBuild) + 1).toString();
                    localStorage.setItem('doors_build', next);
                    window.opener.postMessage({type: 'update_done', build: next}, '*');
                    setTimeout(() => window.close(), 500);
                }
            }, 50);
        }
    </script>
</body>
</html>
