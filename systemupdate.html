<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DoorsOS Update Manager</title>
    <style>
        body { background: #c0c0c0; font-family: 'Courier New', monospace; padding: 20px; }
        .box { border: 3px solid #fff; border-right-color: #808080; border-bottom-color: #808080; padding: 15px; background: #dcdcdc; }
        .log { background: #fff; border: 2px inset; height: 100px; overflow-y: auto; padding: 8px; font-size: 11px; margin: 10px 0; color: #333; }
        .bar-bg { width: 100%; height: 20px; background: #808080; border: 2px inset #fff; margin-top: 5px; }
        #bar { width: 0%; height: 100%; background: #000080; }
        button { padding: 5px 15px; cursor: pointer; font-weight: bold; background: #c0c0c0; border: 2px solid; border-color: #fff #808080 #808080 #fff; }
        button:active { border-color: #808080 #fff #fff #808080; }
        button:disabled { color: #808080; }
    </style>
</head>
<body>
    <div class="box">
        <h2 style="margin:0; font-size: 16px; color: #573a24;">Atualização do Sistema</h2>
        <div class="log" id="status-text">Buscando atualizações na rede...</div>
        <div class="bar-bg"><div id="bar"></div></div>
        <div style="text-align: right; margin-top: 10px;">
            <button id="update-btn" onclick="installUpdate()" disabled>Instalar</button>
        </div>
    </div>

    <script>
        let currentBuild = parseInt(localStorage.getItem('doors_build')) || 999;
        const log = document.getElementById('status-text');
        const btn = document.getElementById('update-btn');

        const changelog = {
            1000: "Build 1000: Correção de bugs críticos de inicialização.",
            1001: "Build 1001: Reforço no Door Security contra Cupins famintos.",
            1002: "Build 1002: NOVIDADE: Adicionado o App Shopping!",
            1003: "Build 1003: Melhoria na renderização WoodCore 32-bit.",
            1004: "Build 1004: Otimização de energia (menos calor na CPU).",
            1005: "Build 1005: Novos ícones em alta resolução (para a época).",
            1006: "Build 1006: Versão final da série 1.0. Estabilidade total."
        };

        window.onload = () => {
            if (currentBuild >= 1006) {
                log.innerHTML = "<b>Doors 1.0 está atualizado.</b><br>Aguarde o Doors 2.0: 2000 Edition.";
            } else {
                let next = currentBuild + 1;
                log.innerHTML = `<b>Nova atualização disponível: Build ${next}</b><br>${changelog[next]}`;
                btn.disabled = false;
            }
        };

        function installUpdate() {
            btn.disabled = true;
            let progress = 0;
            let bar = document.getElementById('bar');
            let interval = setInterval(() => {
                progress += Math.random() * 5;
                bar.style.width = progress + "%";
                log.innerHTML = "Instalando: " + Math.floor(progress) + "%...";
                
                if (progress >= 100) {
                    clearInterval(interval);
                    currentBuild++;
                    localStorage.setItem('doors_build', currentBuild);
                    
                    // Notifica o index.html principal
                    if (window.opener) {
                        window.opener.postMessage({type: 'update_done', build: currentBuild}, '*');
                    }
                    
                    log.innerHTML = "<b style='color:green'>Sucesso! Sistema atualizado para " + currentBuild + "</b>";
                    setTimeout(() => window.close(), 2000);
                }
            }, 100);
        }
    </script>
</body>
</html>
