<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>DoorsOS AI Bugfixer</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            background: url('bottom.jpg') no-repeat center center fixed;
            background-size: cover;
            font-family: 'Courier New', monospace;
            height: 100vh;
            padding: 15px;
            display: flex;
            flex-direction: column;
            color: #d2b48c;
        }

        .container {
            flex: 1;
            background: rgba(43, 29, 14, 0.9);
            border: 4px solid #573a24;
            border-radius: 5px;
            box-shadow: 0 0 15px rgba(0,0,0,0.7);
            display: flex;
            flex-direction: column;
            padding: 15px;
            overflow: hidden;
        }

        .header {
            border-bottom: 2px solid #573a24;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .header h1 { font-size: 20px; font-family: 'Georgia', serif; }
        .header p { font-size: 11px; color: #8b4513; font-weight: bold; }

        .api-config {
            background: #3d2b1f;
            padding: 10px;
            border: 1px dashed #d2b48c;
            margin-bottom: 15px;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .api-config input {
            flex: 1;
            background: #2b1d0e;
            border: 1px solid #573a24;
            color: #fff;
            padding: 5px;
            font-family: inherit;
        }

        .workspace {
            display: flex;
            flex: 1;
            gap: 15px;
            overflow: hidden;
            margin-bottom: 15px;
        }

        .editor-box, .ai-box {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        label { font-size: 12px; font-weight: bold; margin-bottom: 5px; display: block; }

        textarea {
            flex: 1;
            background: #1e1207;
            border: 2px solid #573a24;
            color: #f5deb3;
            padding: 10px;
            font-family: inherit;
            resize: none;
            outline: none;
        }

        .ai-response {
            flex: 1;
            background: #2b1d0e;
            border: 2px solid #573a24;
            color: #a9e0a9;
            padding: 10px;
            overflow-y: auto;
            white-space: pre-wrap;
            font-size: 13px;
        }

        .actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        button {
            background: #8b4513;
            color: white;
            border: 2px outset #d2b48c;
            padding: 8px 20px;
            cursor: pointer;
            font-weight: bold;
            font-family: inherit;
        }

        button:active { border-style: inset; }
        button:disabled { background: #555; border-color: #333; cursor: not-allowed; }

        .btn-success { background: #2e6f2e; }
    </style>
</head>
