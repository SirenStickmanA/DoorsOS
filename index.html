<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>DoorsOS - Historical Edition</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', monospace; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #000; user-select: none; }
        
        /* CURSOR DE MADEIRA PARA PC */
        .pc-user { cursor: url('https://cur.cursors-4u.net/others/oth-9/oth814.cur'), auto !important; }
        .pc-user button, .pc-user .icon, .pc-user .start-item { cursor: pointer !important; }

        /* DESKTOP */
        #desktop { 
            display: none; width: 100%; height: 100%; 
            background: #573a24 url('bottom.jpg') no-repeat center center; 
            background-size: cover; position: relative; 
        }

        /* ÍCONES */
        .shortcuts { padding: 20px; display: flex; flex-direction: column; gap: 20px; width: 120px; }
        .icon { text-align: center; width: 80px; cursor: pointer; }
        .icon-img { width: 48px !important; height: 48px !important; image-rendering: pixelated; margin: 0 auto 5px auto; display: block; }
        .icon span { color: white; font-size: 10px; display: block; background: rgba(0,0,0,0.6); padding: 2px; }

        /* MENU INICIAR */
        #start-menu {
            position: absolute; bottom: 35px; left: 0; width: 220px;
            background: #c0c0c0; border: 2px solid #fff; border-right: 2px solid #808080; border-bottom: 2px solid #808080;
            display: none; flex-direction: column; z-index: 9999;
        }
        .start-item { padding: 8px 12px; font-size: 11px; display: flex; align-items: center; gap: 10px; color: #000; cursor: pointer; }
        .start-item:hover { background: #573a24; color: white; }
        .start-sidebar { width: 25px; background: linear-gradient(#808080, #573a24); position: absolute; left: 0; top: 0; height: 100%; }
        .start-content { margin-left: 25px; }

        /* SISTEMA DE JANELAS (IFRAMES) */
        .window { position: absolute; background: #c0c0c0; border: 2px solid #fff; border-right: 2px solid #808080; border-bottom: 2px solid #808080; display: none; flex-direction: column; z-index: 10; box-shadow: 2px 2px 5px rgba(0,0,0,0.3); }
        .window-title { background: #573a24; color: white; padding: 4px 8px; font-size: 12px; display: flex; justify-content: space-between; align-items: center; font-weight: bold; }
        .close-btn { background: #c0c0c0; border: 1px solid #fff; padding: 0 5px; cursor: pointer; }
        .window-body { flex-grow: 1; background: #fff; }
        iframe { width: 100%; height: 100%; border: none; display: block; }

        /* TASKBAR */
        #taskbar { position: absolute; bottom: 0; width: 100%; height: 35px; background: #c0c0c0; border-top: 2px solid #fff; display: flex; align-items: center; padding: 0 5px; z-index: 10000; }
        .start-btn { font-weight: bold; border: 2px solid; border-color: #fff #808080 #808080 #fff; padding: 2px 10px; display: flex; align-items: center; gap: 5px; cursor: pointer; }
    </style>
</head>
<body id="main-body">

    <div id="boot-screen" style="position:fixed; width:100%; height:100%; background:#000; z-index:100000; display:flex; flex-direction:column; align-items:center; justify-content:center; color:#fff;">
        <img id="boot-logo" src="doors1.0.jpeg" width="350">
        <div style="width:200px; height:10px; border:1px solid #573a24; margin-top:20px;">
            <div id="boot-progress" style="width:0%; height:100%; background:#8B5A2B;"></div>
        </div>
        <p id="boot-year" style="margin-top:10px; font-size:10px;">© 1999 Doors Corp</p>
    </div>

    <div id="start-menu">
        <div class="start-sidebar"></div>
        <div class="start-content">
            <div class="start-item" onclick="openWindow('handle-win')">🌐 Handle Browser</div>
            <div class="start-item" onclick="openWindow('shopping-win')">🛍️ Shopping (B1002)</div>
            <hr>
            <div class="start-item" onclick="openWindow('doorman-win')">📝 Doorman</div>
            <div class="start-item" onclick="openWindow('doormaker-win')">📊 Door Maker</div>
            <div class="start-item" onclick="openWindow('doorworker-win')">🛠️ Door Worker</div>
            <hr>
            <div class="start-item" onclick="openWindow('explosivefield-win')">💣 Campo Explosivo</div>
            <div class="start-item" onclick="openWindow('cupimrpg-win')">🐜 Cupim RPG</div>
        </div>
    </div>

    <div id="desktop">
        <div class="shortcuts">
            <div class="icon" onclick="openWindow('handle-win')">
                <img class="icon-img" src="handle.jpg">
                <span>Handle Web</span>
            </div>
        </div>

        <div class="window" id="shopping-win" style="top:50px; left:50px; width:600px; height:450px;">
            <div class="window-title"><span>Doors Shopping</span><button class="close-btn" onclick="closeWindow('shopping-win')">X</button></div>
            <div class="window-body"><iframe src="shopping.html"></iframe></div>
        </div>

        <div class="window" id="cupimrpg-win" style="top:80px; left:100px; width:400px; height:300px;">
            <div class="window-title"><span>Cupim RPG</span><button class="close-btn" onclick="closeWindow('cupimrpg-win')">X</button></div>
            <div class="window-body"><iframe src="cupimrpg.html"></iframe></div>
        </div>

        <div class="window" id="explosivefield-win" style="top:110px; left:150px; width:320px; height:400px;">
            <div class="window-title"><span>Campo Explosivo</span><button class="close-btn" onclick="closeWindow('explosivefield-win')">X</button></div>
            <div class="window-body"><iframe src="explosivefield.html"></iframe></div>
        </div>

        <div class="window" id="doorman-win" style="top:140px; left:200px; width:500px; height:350px;">
            <div class="window-title"><span>Doorman</span><button class="close-btn" onclick="closeWindow('doorman-win')">X</button></div>
            <div class="window-body"><iframe src="doorman.html"></iframe></div>
        </div>

        <div id="taskbar">
            <div class="start-btn" onclick="toggleStart()">🚪 Iniciar</div>
            <div style="margin-left: auto; font-size: 11px; padding-right: 10px;"><span id="os-clock">00:00</span></div>
        </div>
    </div>

    <script>
        // Detecção de PC para cursor customizado
        const isMobile = /android|iphone|ipad|ipod/i.test(navigator.userAgent.toLowerCase());
        if (!isMobile) document.body.classList.add('pc-user');

        // Animação de Boot
        window.onload = () => {
            let p = 0;
            const interval = setInterval(() => {
                p += 5;
                document.getElementById('boot-progress').style.width = p + "%";
                if(p >= 100) {
                    clearInterval(interval);
                    document.getElementById('boot-screen').style.display = 'none';
                    document.getElementById('desktop').style.display = 'block';
                }
            }, 50);
            updateClock();
            setInterval(updateClock, 1000);
        };

        function updateClock() {
            const d = new Date();
            document.getElementById('os-clock').innerText = d.getHours().toString().padStart(2,'0') + ":" + d.getMinutes().toString().padStart(2,'0');
        }

        function toggleStart() {
            const m = document.getElementById('start-menu');
            m.style.display = m.style.display === 'flex' ? 'none' : 'flex';
        }

        function openWindow(id) {
            const win = document.getElementById(id);
            if(win) {
                win.style.display = 'flex';
                document.getElementById('start-menu').style.display = 'none';
            }
        }

        function closeWindow(id) { document.getElementById(id).style.display = 'none'; }

        document.addEventListener('keydown', (e) => {
            if (e.key.toLowerCase() === 'd' && e.target.tagName !== 'INPUT') toggleStart();
        });
    </script>
</body>
    </html>
