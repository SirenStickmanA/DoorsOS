<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DoorsOS - Wooden Door Edition</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', Courier, monospace; user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #000; }
        
        .mode-16bit { filter: contrast(120%) posterize(8) sepia(0.2); }
        .mode-16bit #desktop { background-color: #3d2618 !important; image-rendering: pixelated; }

        #boot-screen { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: #000; display: flex; flex-direction: column; 
            justify-content: center; align-items: center; z-index: 10000; 
        }
        #boot-logo { width: 85%; max-width: 370px; height: auto; margin-bottom: 20px; }
        .loading-bar { width: 60%; max-width: 250px; height: 10px; background: #333; border: 2px solid #573a24; position: relative; overflow: hidden; }
        .loading-progress { width: 0%; height: 100%; background: #8B5A2B; }
        #boot-text { color: #8B5A2B; font-size: 12px; margin-top: 10px; font-weight: bold; }

        #desktop { 
            display: none; flex-direction: column; width: 100%; height: 100%; 
            background: #573a24 url('bottom.jpg') no-repeat center center; 
            background-size: cover; padding: 15px; position: relative; 
        }
        
        .shortcuts-container { display: flex; flex-direction: column; gap: 15px; width: 90px; }
        .desktop-shortcut { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 85px; padding: 8px; border: 1px dashed transparent; cursor: pointer; text-align: center; }
        .desktop-shortcut:hover { border-color: rgba(255,255,255,0.5); background: rgba(255,255,255,0.1); }
        .shortcut-img { width: 45px; height: 45px; image-rendering: pixelated; object-fit: contain; margin-bottom: 5px; }
        .shortcut-name { color: #fff; font-size: 11px; font-weight: bold; text-shadow: 1px 1px 2px #000; background: rgba(0,0,0,0.5); padding: 2px 4px; }

        #cupim-virus { position: absolute; width: 50px; height: 50px; z-index: 9999; display: none; pointer-events: none; }

        .window { position: absolute; background: #f0f0f0; border: 3px solid #fff; border-right-color: #808080; border-bottom-color: #808080; box-shadow: 2px 2px 10px rgba(0,0,0,0.5); display: none; flex-direction: column; z-index: 5; min-width: 200px; }
        .window-title { background: #573a24; color: white; padding: 6px; font-weight: bold; font-size: 13px; display: flex; justify-content: space-between; align-items: center; }
        .close-btn { background: #c0c0c0; border: 2px solid; border-color: #fff #808080 #808080 #fff; padding: 0px 6px; cursor: pointer; }

        #taskbar { position: absolute; bottom: 0; left: 0; width: 100%; height: 40px; background: #c0c0c0; border-top: 2px solid #fff; display: flex; justify-content: space-between; align-items: center; padding: 0 5px; z-index: 100; }
        .start-btn { background: #c0c0c0; border: 2px solid; border-color: #fff #808080 #808080 #fff; padding: 2px 10px; font-weight: bold; cursor: pointer; }
        
        .system-tray { display: flex; gap: 8px; font-size: 11px; align-items: center; }
        .tray-item { border: 2px inset #fff; padding: 2px 6px; background: #c0c0c0; }
        .warning-text { color: red; font-weight: bold; animation: pisca 0.5s infinite; display: none; }
        @keyframes pisca { 0% { opacity: 0; } 100% { opacity: 1; } }

        #shutdown-screen { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background:#000; color:#fff; justify-content:center; align-items:center; flex-direction:column; z-index:20000; }
    </style>
</head>
<body onclick="initAudioContext()">

    <div id="boot-screen">
        <img id="boot-logo" src="doors1.0.jpeg">
        <div class="loading-bar"><div class="loading-progress" id="b-progress"></div></div>
        <div id="boot-text">Iniciando...</div>
    </div>

    <img src="https://img.icons8.com/color/48/termite.png" id="cupim-virus">

    <div id="shutdown-screen">
        <p>O DoorsOS foi desligado com segurança.</p>
    </div>

    <div id="desktop" onclick="closeMenu()">
        <div class="shortcuts-container">
            <div class="desktop-shortcut" onclick="openWindow('browser-window')">
                <img src="handle.jpeg" class="shortcut-img" id="handle-icon" alt="Handle">
                <span class="shortcut-name">Handle Web</span>
            </div>
            <div class="desktop-shortcut" onclick="openWindow('os-settings-window')">
                <img src="https://img.icons8.com/color/48/settings.png" class="shortcut-img">
                <span class="shortcut-name">Painel</span>
            </div>
            <div class="desktop-shortcut" id="icon-shopping" style="display:none;" onclick="openShopping()">
                <img src="https://img.icons8.com/color/48/shopping-cart.png" class="shortcut-img">
                <span class="shortcut-name">Shopping</span>
            </div>
        </div>

        <div class="window" id="os-settings-window">
            <div class="window-title"><span>Painel de Controle</span><button class="close-btn" onclick="closeWindow('os-settings-window')">X</button></div>
            <div style="padding:15px; font-size:12px;">
                <p><b id="os-title">Doors 1.0: Wooden Door</b></p>
                <p>Versão: Build <span id="build-ver">999</span></p>
                <p>Arquitetura: <span id="arch-text">32-bit</span></p>
                <hr style="margin:10px 0;">
                <button onclick="checkUpdate()" style="padding:5px; width:100%;">Verificar Atualizações</button>
            </div>
        </div>

        <div class="window" id="browser-window">
            <div class="window-title"><span>Handle Navigator</span><button class="close-btn" onclick="closeWindow('browser-window')">X</button></div>
            <div style="padding:20px; background:white; text-align:center;">
                <h3>Handle Search</h3>
                <input type="text" placeholder="Buscar na WoodNet...">
            </div>
        </div>

        <div id="start-menu" style="position:absolute; bottom:40px; left:0; width:160px; background:#c0c0c0; border:2px solid #fff; display:none; flex-direction:column;">
            <div style="padding:10px; cursor:pointer;" onclick="shutdown()">Desligar...</div>
        </div>

        <div id="taskbar">
            <button class="start-btn" onclick="toggleMenu(event)">Iniciar</button>
            <div class="system-tray">
                <span id="warn-overheat" class="warning-text">⚠️ OVERHEAT</span>
                <div class="tray-item" id="cpu-load">CPU: 2%</div>
                <div class="tray-item" id="date-display" style="display:none;">31/12/1999</div>
                <div class="tray-item" id="clock">00:00</div>
            </div>
        </div>
    </div>

    <script>
        let appsOpen = 0, cpuUsage = 2, temperature = 35, isVirusActive = false, is16bit = false;
        
        // ESTADO DO SISTEMA
        let currentBuild = localStorage.getItem('doors_build') || "999";

        function applyBuildEffects() {
            const buildSpan = document.getElementById('build-ver');
            const osTitle = document.getElementById('os-title');
            const dateSpan = document.getElementById('date-display');
            const bootImg = document.getElementById('boot-logo');
            const handleImg = document.getElementById('handle-icon');
            const shopIcon = document.getElementById('icon-shopping');

            // SE FOR DOORS 2.0
            if (currentBuild === "2000_Edition") {
                osTitle.innerText = "Doors 2.0: 2000 Edition";
                buildSpan.innerText = "999";
                dateSpan.innerText = "01/01/2000";
                dateSpan.style.display = 'inline';
                bootImg.src = "doors2.0.jpeg";
                handleImg.src = "handle2000.jpeg";
                shopIcon.style.display = 'flex';
                return;
            }

            // SE FOR DOORS 1.0
            let b = parseInt(currentBuild);
            buildSpan.innerText = b;
            if (b >= 1002) shopIcon.style.display = 'flex';
            if (b >= 1005) {
                dateSpan.style.display = 'inline';
                dateSpan.innerText = "31/12/1999";
            }
        }

        function triggerMillenniumBug() {
            document.getElementById('desktop').style.display = 'none';
            const boot = document.getElementById('boot-screen');
            boot.style.display = 'flex';
            document.getElementById('boot-text').innerText = "Instalando Doors 2.0: 2000 Edition...";
            
            let w = 0;
            const prog = document.getElementById('b-progress');
            const t = setInterval(() => {
                w += 2;
                prog.style.width = w + '%';
                if(w >= 100) {
                    clearInterval(t);
                    applyBuildEffects();
                    setTimeout(() => {
                        boot.style.display = 'none';
                        document.getElementById('desktop').style.display = 'flex';
                        alert("Upgrade concluído. Bem-vindo ao ano 2000.");
                    }, 1000);
                }
            }, 50);
        }

        window.addEventListener('message', (e) => {
            if(e.data.type === 'update_done') {
                let old = currentBuild;
                currentBuild = e.data.build;
                if(old === "1006" && currentBuild === "2000_Edition") {
                    triggerMillenniumBug();
                } else {
                    applyBuildEffects();
                }
            }
        });

        function checkUpdate() { window.open('systemupdate.html', 'upd', 'width=400,height=300'); }
        function openShopping() { window.open('shopping.html', 'shop', 'width=500,height=400'); }

        setInterval(() => {
            let targetCPU = 2 + (appsOpen * 15) + (isVirusActive ? 40 : 0);
            cpuUsage = Math.floor(cpuUsage + (targetCPU - cpuUsage) * 0.1);
            temperature = Math.floor(30 + (cpuUsage * 0.5));
            document.getElementById('cpu-load').innerText = `CPU: ${cpuUsage}%`;
            
            if (temperature > 48 && !is16bit) {
                is16bit = true; document.body.classList.add('mode-16bit');
                document.getElementById('warn-overheat').style.display = "block";
            } else if (temperature <= 48 && is16bit) {
                is16bit = false; document.body.classList.remove('mode-16bit');
                document.getElementById('warn-overheat').style.display = "none";
            }
        }, 1000);

        window.onload = () => {
            applyBuildEffects();
            let w = 0;
            const t = setInterval(() => {
                w += 5;
                document.getElementById('b-progress').style.width = w + '%';
                if(w >= 100) {
                    clearInterval(t);
                    document.getElementById('boot-screen').style.display = 'none';
                    document.getElementById('desktop').style.display = 'flex';
                }
            }, 100);
            setInterval(() => {
                const n = new Date();
                document.getElementById('clock').innerText = n.getHours().toString().padStart(2, '0') + ":" + n.getMinutes().toString().padStart(2, '0');
            }, 1000);
        };

        function openWindow(id) { document.getElementById(id).style.display = 'flex'; appsOpen++; }
        function closeWindow(id) { document.getElementById(id).style.display = 'none'; appsOpen--; }
        function toggleMenu(e) { e.stopPropagation(); const m = document.getElementById('start-menu'); m.style.display = (m.style.display === 'flex') ? 'none' : 'flex'; }
        function closeMenu() { document.getElementById('start-menu').style.display = 'none'; }
        function shutdown() { document.getElementById('desktop').style.display = 'none'; document.getElementById('shutdown-screen').style.display = 'flex'; }
        function initAudioContext() {}
    </script>
</body>
    </html>
