<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>DoorsOS - Historical Edition</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', monospace; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #000; user-select: none; }
        
        .pc-user { cursor: url('https://cur.cursors-4u.net/others/oth-9/oth814.cur'), auto !important; }
        .pc-user button, .pc-user .icon, .pc-user .start-item { cursor: pointer !important; }

        #desktop { 
            display: none; width: 100%; height: 100%; 
            background: #573a24 url('bottom.jpg') no-repeat center center; 
            background-size: cover; position: relative; 
        }

        /* Atalhos */
        .shortcuts { padding: 20px; display: flex; flex-direction: column; gap: 20px; width: 120px; }
        .icon { text-align: center; width: 80px; cursor: pointer; z-index: 5; }
        .icon-img { width: 48px !important; height: 48px !important; image-rendering: pixelated; margin: 0 auto 5px auto; display: block; }
        .icon span { color: white; font-size: 10px; display: block; background: rgba(0,0,0,0.6); padding: 2px; }

        /* Menu Iniciar */
        #start-menu {
            position: absolute; bottom: 35px; left: 0; width: 220px;
            background: #c0c0c0; border: 2px solid #fff; border-right: 2px solid #808080; border-bottom: 2px solid #808080;
            display: none; flex-direction: column; z-index: 9999;
        }
        .start-item { padding: 8px 12px; font-size: 11px; display: flex; align-items: center; gap: 10px; color: #000; cursor: pointer; }
        .start-item:hover { background: #573a24; color: white; }
        .start-sidebar { width: 25px; background: linear-gradient(#808080, #573a24); position: absolute; left: 0; top: 0; height: 100%; }
        .start-content { margin-left: 25px; }

        /* Sistema de Janelas */
        .window { 
            position: absolute; background: #c0c0c0; 
            border: 2px solid #fff; border-right: 2px solid #808080; border-bottom: 2px solid #808080; 
            display: none; flex-direction: column; z-index: 10; 
            box-shadow: 2px 2px 5px rgba(0,0,0,0.3);
            min-width: 200px; min-height: 150px;
            resize: both; overflow: auto; /* Redimensionamento nativo */
        }
        
        .window-title { 
            background: #573a24; color: white; padding: 4px 8px; 
            font-size: 12px; display: flex; justify-content: space-between; 
            align-items: center; font-weight: bold; cursor: move; /* Cursor de mover */
        }

        .title-controls { display: flex; gap: 3px; }
        .win-btn { 
            background: #c0c0c0; border: 1px solid #fff; 
            border-right: 1px solid #808080; border-bottom: 1px solid #808080;
            padding: 0 4px; cursor: pointer; color: #000; font-size: 10px; font-weight: bold;
            min-width: 16px; text-align: center;
        }
        .win-btn:active { border: 1px inset #808080; }

        .window-body { flex-grow: 1; background: #fff; overflow: hidden; position: relative; }
        iframe { width: 100%; height: 100%; border: none; pointer-events: auto; }
        
        /* Overlay para permitir mover a janela mesmo sobre o iframe */
        .iframe-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; }

        /* Barra de Tarefas */
        #taskbar { 
            position: absolute; bottom: 0; width: 100%; height: 35px; 
            background: #c0c0c0; border-top: 2px solid #fff; 
            display: flex; align-items: center; padding: 0 5px; z-index: 10000; 
        }
        .start-btn { 
            font-weight: bold; border: 2px solid; border-color: #fff #808080 #808080 #fff; 
            padding: 2px 10px; display: flex; align-items: center; gap: 5px; cursor: pointer; 
        }
        .start-btn:active { border-color: #808080 #fff #fff #808080; }

        .systray { margin-left: auto; display: flex; flex-direction: column; align-items: flex-end; padding-right: 5px; }
        #os-clock { font-size: 11px; font-weight: bold; }
        #os-date { font-size: 9px; }
    </style>
</head>
<body id="main-body">

    <div id="boot-screen" style="position:fixed; width:100%; height:100%; background:#000; z-index:100000; display:flex; flex-direction:column; align-items:center; justify-content:center; color:#fff;">
        <img id="boot-logo" src="doors1.0.jpeg" width="350">
        <div style="width:200px; height:10px; border:1px solid #573a24; margin-top:20px;">
            <div id="boot-progress" style="width:0%; height:100%; background:#8B5A2B;"></div>
        </div>
        <p id="boot-year" style="margin-top:10px; font-size:10px;">© 1999 Doors Corp</p>
    </div>

    <div id="start-menu">
        <div class="start-sidebar"></div>
        <div class="start-content">
            <div class="start-item" onclick="openWindow('handle-win')">🌐 Handle Browser</div>
            <div class="start-item" onclick="openWindow('messenger-win')">💬 OpenDoor Messenger</div>
            <div class="start-item" onclick="openWindow('shopping-win')">🛍️ Shopping (B1002)</div>
            <div class="start-item" onclick="openWindow('drawer-win')">📂 Drawer</div>
            <hr>
            <div class="start-item" onclick="openWindow('doorman-win')">📝 Doorman</div>
            <div class="start-item" onclick="openWindow('doormaker-win')">📊 Door Maker</div>
            <div class="start-item" onclick="openWindow('doorworker-win')">🛠️ Door Worker</div>
            <hr>
            <div class="start-item" onclick="openWindow('explosivefield-win')">💣 Campo Explosivo</div>
            <div class="start-item" onclick="openWindow('cupimrpg-win')">🐜 Cupim RPG</div>
            <hr>
            <div class="start-item" onclick="openWindow('panel-win')">⚙️ Door Panel</div>
        </div>
    </div>

    <div id="desktop">
        <div class="shortcuts">
            <div class="icon" onclick="openWindow('handle-win')">
                <img class="icon-img" src="handle.jpg">
                <span>Handle Web</span>
            </div>
            <div class="icon" onclick="openWindow('messenger-win')">
                <img class="icon-img" src="messenger_icon.jpg"> 
                <span>Messenger</span>
            </div>
            <div class="icon" onclick="openWindow('drawer-win')">
                <img class="icon-img" src="drawer_icon.jpg"> <span>Drawer</span>
            </div>
        </div>

        <div class="window" id="handle-win" style="top:30px; left:30px; width:500px; height:380px;">
            <div class="window-title">
                <span>Handle Browser</span>
                <div class="title-controls">
                    <button class="win-btn" onclick="minimizeWindow('handle-win')">_</button>
                    <button class="win-btn" onclick="maximizeWindow('handle-win')">[]</button>
                    <button class="win-btn" onclick="closeWindow('handle-win')">X</button>
                </div>
            </div>
            <div class="window-body">
                <div class="iframe-overlay"></div>
                <iframe src="handle.html"></iframe>
            </div>
        </div>

        <div class="window" id="messenger-win" style="top:40px; left:100px; width:650px; height:520px;">
            <div class="window-title">
                <span>OpenDoor Messenger</span>
                <div class="title-controls">
                    <button class="win-btn" onclick="minimizeWindow('messenger-win')">_</button>
                    <button class="win-btn" onclick="maximizeWindow('messenger-win')">[]</button>
                    <button class="win-btn" onclick="closeWindow('messenger-win')">X</button>
                </div>
            </div>
            <div class="window-body">
                <div class="iframe-overlay"></div>
                <iframe src="opendoormessenger.html"></iframe>
            </div>
        </div>

        <div class="window" id="drawer-win" style="top:50px; left:50px; width:450px; height:320px;">
            <div class="window-title">
                <span>Drawer</span>
                <div class="title-controls">
                    <button class="win-btn" onclick="minimizeWindow('drawer-win')">_</button>
                    <button class="win-btn" onclick="maximizeWindow('drawer-win')">[]</button>
                    <button class="win-btn" onclick="closeWindow('drawer-win')">X</button>
                </div>
            </div>
            <div class="window-body">
                <div class="iframe-overlay"></div>
                <iframe src="drawer.html"></iframe>
            </div>
        </div>

        <div id="taskbar">
            <div class="start-btn" onclick="toggleStart()">🚪 Iniciar</div>
            <div class="systray">
                <span id="os-clock">00:00</span>
                <span id="os-date">01/01/1999</span>
            </div>
        </div>
    </div>

    <script>
        // Sistema de Boot
        window.onload = () => {
            let p = 0;
            const interval = setInterval(() => {
                p += 5;
                document.getElementById('boot-progress').style.width = p + "%";
                if(p >= 100) {
                    clearInterval(interval);
                    document.getElementById('boot-screen').style.display = 'none';
                    document.getElementById('desktop').style.display = 'block';
                }
            }, 50);
            updateClock();
            setInterval(updateClock, 1000);
            initDrag();
        };

        // Relógio e Data
        function updateClock() {
            const d = new Date();
            const hours = d.getHours().toString().padStart(2,'0');
            const mins = d.getMinutes().toString().padStart(2,'0');
            const day = d.getDate().toString().padStart(2,'0');
            const month = (d.getMonth() + 1).toString().padStart(2,'0');
            const year = d.getFullYear();
            
            document.getElementById('os-clock').innerText = `${hours}:${mins}`;
            document.getElementById('os-date').innerText = `${day}/${month}/${year}`;
        }

        // Funções de Janela
        let topZ = 10;

        function openWindow(id) {
            const win = document.getElementById(id);
            if(win) {
                topZ++;
                win.style.zIndex = topZ;
                win.style.display = 'flex';
                toggleStart(false);
            }
        }

        function closeWindow(id) { document.getElementById(id).style.display = 'none'; }
        
        function minimizeWindow(id) { 
            document.getElementById(id).style.display = 'none'; 
            // Em um sistema real ele ficaria na barra, aqui apenas fechamos/escondemos
        }

        function maximizeWindow(id) {
            const win = document.getElementById(id);
            if (win.style.width === '100%') {
                win.style.width = '500px';
                win.style.height = '380px';
                win.style.top = '50px';
                win.style.left = '50px';
            } else {
                win.style.width = '100%';
                win.style.height = 'calc(100% - 35px)';
                win.style.top = '0';
                win.style.left = '0';
            }
        }

        function toggleStart(forceClose = null) {
            const m = document.getElementById('start-menu');
            if (forceClose === false) m.style.display = 'none';
            else m.style.display = m.style.display === 'flex' ? 'none' : 'flex';
        }

        // Sistema de Arrastar (Drag and Drop)
        function initDrag() {
            const windows = document.querySelectorAll('.window');
            windows.forEach(win => {
                const titleBar = win.querySelector('.window-title');
                let isDragging = false;
                let offset = { x: 0, y: 0 };

                titleBar.addEventListener('mousedown', (e) => {
                    isDragging = true;
                    topZ++;
                    win.style.zIndex = topZ;
                    offset.x = e.clientX - win.offsetLeft;
                    offset.y = e.clientY - win.offsetTop;
                    
                    // Mostra overlay para o mouse não "perder" a janela ao passar sobre o iframe
                    win.querySelectorAll('.iframe-overlay').forEach(ov => ov.style.display = 'block');
                });

                document.addEventListener('mousemove', (e) => {
                    if (!isDragging) return;
                    win.style.left = (e.clientX - offset.x) + 'px';
                    win.style.top = (e.clientY - offset.y) + 'px';
                });

                document.addEventListener('mouseup', () => {
                    isDragging = false;
                    document.querySelectorAll('.iframe-overlay').forEach(ov => ov.style.display = 'none');
                });
            });
        }

        document.addEventListener('keydown', (e) => {
            if (e.key.toLowerCase() === 'd' && e.target.tagName !== 'INPUT') toggleStart();
        });
    </script>
</body>
            </html>
