<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>DoorsOS - Historical Edition</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', monospace; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #000; user-select: none; }
        
        /* CURSOR DE MADEIRA (Apenas para PC) */
        .pc-user { 
            cursor: url('https://cur.cursors-4u.net/others/oth-9/oth814.cur'), auto; 
        }
        .pc-user button, .pc-user .icon, .pc-user .start-item { cursor: pointer; }

        /* DESKTOP */
        #desktop { 
            display: none; width: 100%; height: 100%; 
            background: #573a24; /* Caso a imagem falhe */
            background-image: url('bottom.jpg');
            background-size: cover; position: relative; 
        }

        /* AJUSTE DOS ÍCONES (Onde estava o erro de tamanho) */
        .shortcuts { padding: 20px; display: flex; flex-direction: column; gap: 20px; width: 120px; }
        .icon { text-align: center; width: 80px; }
        .icon-img { 
            width: 48px; height: 48px; 
            image-rendering: pixelated; 
            margin-bottom: 5px;
        }
        .icon span { 
            color: white; font-size: 10px; display: block; 
            background: rgba(0,0,0,0.6); padding: 2px;
        }

        /* MENU INICIAR */
        #start-menu {
            position: absolute; bottom: 35px; left: 0; width: 220px;
            background: #c0c0c0; border: 2px solid #fff; border-right: 2px solid #808080; border-bottom: 2px solid #808080;
            display: none; flex-direction: column; z-index: 9999;
        }
        .start-item { padding: 8px 12px; font-size: 11px; display: flex; align-items: center; gap: 10px; color: #000; }
        .start-item:hover { background: #573a24; color: white; }
        .start-sidebar { width: 25px; background: linear-gradient(#808080, #573a24); position: absolute; left: 0; top: 0; height: 100%; }
        .start-content { margin-left: 25px; }

        /* JANELAS */
        .window { position: absolute; background: #c0c0c0; border: 2px solid #fff; border-right: 2px solid #808080; border-bottom: 2px solid #808080; display: none; flex-direction: column; min-width: 350px; z-index: 10; }
        .window-title { background: #573a24; color: white; padding: 4px 8px; font-size: 12px; display: flex; justify-content: space-between; align-items: center; }
        .close-btn { background: #c0c0c0; border: 1px solid #fff; padding: 0 5px; }

        /* TASKBAR */
        #taskbar { position: absolute; bottom: 0; width: 100%; height: 35px; background: #c0c0c0; border-top: 2px solid #fff; display: flex; align-items: center; padding: 0 5px; z-index: 10000; }
        .start-btn { font-weight: bold; border: 2px solid; border-color: #fff #808080 #808080 #fff; padding: 2px 10px; display: flex; align-items: center; gap: 5px; }
        
        /* ESTILO DOS APPS */
        .office-area { background: white; border: 2px inset #fff; width: 100%; height: 250px; }
        #campo-grid { display: grid; grid-template-columns: repeat(8, 30px); gap: 2px; }
        .cell { width: 30px; height: 30px; background: #c0c0c0; border: 2px solid; border-color: #fff #808080 #808080 #fff; text-align: center; line-height: 30px; }
    </style>
</head>
<body id="main-body">

    <div id="boot-screen" style="position:fixed; width:100%; height:100%; background:#000; z-index:100000; display:flex; flex-direction:column; align-items:center; justify-content:center; color:#fff;">
        <img id="boot-logo" src="doors1.0.jpeg" width="350">
        <div style="width:200px; height:10px; border:1px solid #573a24; margin-top:20px;">
            <div id="boot-progress" style="width:0%; height:100%; background:#8B5A2B;"></div>
        </div>
        <p id="boot-year" style="margin-top:10px; font-size:10px;">© 1999 Doors Corp</p>
    </div>

    <div id="start-menu">
        <div class="start-sidebar"></div>
        <div class="start-content">
            <div class="start-item" onclick="openWindow('handle-win')">🌐 Handle Browser</div>
            <hr>
            <div class="start-item" onclick="openWindow('doorman-win')">📝 Doorman (Word)</div>
            <div class="start-item" onclick="openWindow('maker-win')">📊 Door Maker (Excel)</div>
            <div class="start-item" onclick="openWindow('rebuild-win')">🖼️ Rebuild Doors</div>
            <hr>
            <div class="start-item" onclick="openWindow('campo-win')">💣 Campo Explosivo</div>
            <div class="start-item" onclick="openWindow('cupim-win')">🐜 Cupim RPG</div>
            <hr>
            <div class="start-item" onclick="openWindow('settings-win')">⚙️ Painel de Controle</div>
        </div>
    </div>

    <div id="desktop">
        <div class="shortcuts">
            <div class="icon" onclick="openWindow('handle-win')">
                <img id="handle-icon" class="icon-img" src="handle.jpg">
                <span>Handle Web</span>
            </div>
        </div>

        <div class="window" id="handle-win" style="top:30px; left:50px; width:500px;">
            <div class="window-title"><span>Handle Browser v1.0</span><button class="close-btn" onclick="closeWindow('handle-win')">X</button></div>
            <div style="background:#8c6239; padding:5px; border-bottom:2px solid #5c3a21; display:flex; gap:5px;">
                <input type="text" value="door://home.wood" style="flex:1; font-size:10px;">
                <button style="font-size:10px; padding:0 5px;">Girar 🔑</button>
            </div>
            <div class="window-body" style="background:#fcf8f2; height:250px; color:#5c3a21; text-align:center;">
                <h3>Bem-vindo à WoodNet</h3>
            </div>
        </div>

        <div id="taskbar">
            <div class="start-btn" onclick="toggleStart()">
                <span style="font-size:16px;">🚪</span> Iniciar
            </div>
            <div style="margin-left: auto; font-size: 11px; padding-right: 10px;">
                <span id="os-clock">00:00</span>
            </div>
        </div>
    </div>

    <script>
        // DETECÇÃO DE PC VS MOBILE REAL
        const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
        if (!isMobile) {
            document.body.classList.add('pc-user');
        }

        // HISTÓRICO E CONFIGS
        let currentBuild = localStorage.getItem('doors_build') || "999";

        // BOOT ANIMATION
        window.onload = () => {
            let p = 0;
            const interval = setInterval(() => {
                p += 4;
                document.getElementById('boot-progress').style.width = p + "%";
                if(p >= 100) {
                    clearInterval(interval);
                    document.getElementById('boot-screen').style.display = 'none';
                    document.getElementById('desktop').style.display = 'block';
                }
            }, 50);
            updateClock();
            setInterval(updateClock, 1000);
        };

        function updateClock() {
            const d = new Date();
            document.getElementById('os-clock').innerText = d.getHours().toString().padStart(2,'0') + ":" + d.getMinutes().toString().padStart(2,'0');
        }

        // MENU INICIAR (Tecla D)
        function toggleStart() {
            const menu = document.getElementById('start-menu');
            menu.style.display = (menu.style.display === 'flex') ? 'none' : 'flex';
        }

        document.addEventListener('keydown', (e) => {
            if (e.key.toLowerCase() === 'd' && e.target.tagName !== 'TEXTAREA' && e.target.tagName !== 'INPUT') {
                toggleStart();
            }
        });

        // FUNÇÕES DE JANELA
        function openWindow(id) { 
            document.getElementById(id).style.display = 'flex'; 
            document.getElementById('start-menu').style.display = 'none';
        }
        function closeWindow(id) { document.getElementById(id).style.display = 'none'; }

        // Inicializar jogos e tabelas aqui se desejar...
    </script>
</body>
</html>
