<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <style>
        body { background: #fff; font-family: 'Courier New', monospace; margin: 0; padding: 0; }
        .nav { background: #c0c0c0; padding: 5px; border-bottom: 2px solid #808080; display: flex; gap: 5px; font-size: 11px; }
        .address { border: 1px inset #fff; background: #fff; flex: 1; padding: 2px; }
        .file-grid { display: grid; grid-template-columns: repeat(auto-fill, 70px); gap: 10px; padding: 15px; }
        .file { text-align: center; cursor: pointer; }
        .file:hover { background: #e6f2ff; }
        .file-icon { font-size: 30px; display: block; margin-bottom: 5px; }
        .file-name { font-size: 10px; color: #000; word-break: break-all; }
    </style>
</head>
<body>
    <div class="nav">
        <button onclick="alert('Voltando...')">⬅️</button>
        <div class="address">C:\SISTEMA\PORTAS\</div>
    </div>
    <div class="file-grid">
        <div class="file" onclick="alert('Pasta de sistema protegida!')">
            <span class="file-icon">📁</span>
            <span class="file-name">Kernel</span>
        </div>
        <div class="file">
            <span class="file-icon">📁</span>
            <span class="file-name">Drivers</span>
        </div>
        <div class="file">
            <span class="file-icon">📄</span>
            <span class="file-name">leia-me.txt</span>
        </div>
        <div class="file">
            <span class="file-icon">🖼️</span>
            <span class="file-name">fundo.jpg</span>
        </div>
    </div>
</body>
  </html>
